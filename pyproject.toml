[project]
name = "minimax-music3-runpod"
version = "0.1.0"
description = "RunPod Serverless worker for MiniMax-Music3 text-to-music generation"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
